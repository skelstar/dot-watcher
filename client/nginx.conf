server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # iOS universal links: Apple fetches this extensionless file and requires JSON
    # with no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
