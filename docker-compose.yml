services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dotwatcher
      POSTGRES_PASSWORD: dotwatcher-dev
      POSTGRES_DB: dotwatcher
    ports:
      - "5432:5432"
    volumes:
      - dotwatcher-postgres-data:/var/lib/postgresql/data

volumes:
  dotwatcher-postgres-data:
