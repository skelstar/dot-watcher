<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DotWatcher Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; font-size: 13px; padding: 16px; }
    h2 { color: #58a6ff; margin-bottom: 10px; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 32px); }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .sessions-list { overflow-y: auto; flex: 1; }
    .session-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .session-item:hover { background: #21262d; }
    .session-code { color: #f0883e; font-weight: bold; }
    .dl-link { color: #58a6ff; text-decoration: none; font-size: 11px; }
    .dl-link:hover { text-decoration: underline; }
    .log-panel { flex: 1; overflow-y: auto; display: flex; flex-direction: column-reverse; }
    .log-line { padding: 2px 4px; border-radius: 2px; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
    .log-line:nth-child(odd) { background: #1c2128; }
    .log-line.warn { color: #e3b341; }
    .log-line.error { color: #f85149; }
    .log-line.crit { color: #f85149; font-weight: bold; }
    .status { color: #8b949e; font-size: 11px; margin-top: 8px; }
    .empty { color: #484f58; padding: 8px; }
    .badge { background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 10px; padding: 1px 7px; font-size: 10px; }
    .upload-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 6px; }
    .upload-section input[type=text], .upload-section input[type=password] { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; padding: 4px 8px; font-family: monospace; font-size: 12px; width: 100%; }
    .upload-section input[type=text]:focus, .upload-section input[type=password]:focus { outline: none; border-color: #58a6ff; }
    .upload-label { color: #8b949e; font-size: 11px; }
    .upload-btn { background: #238636; border: 1px solid #2ea043; border-radius: 4px; color: #fff; padding: 5px 10px; font-family: monospace; font-size: 12px; cursor: pointer; }
    .upload-btn:hover { background: #2ea043; }
    .upload-btn:disabled { opacity: 0.5; cursor: default; }
    .upload-status { font-size: 11px; min-height: 14px; }
    .upload-status.ok { color: #3fb950; }
    .upload-status.err { color: #f85149; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="panel">
      <h2>Sessions <span id="session-count" class="badge">0</span></h2>
      <div class="sessions-list" id="sessions"></div>
      <div class="status" id="sessions-status"></div>
      <div class="upload-section">
        <span class="upload-label">Upload recording</span>
        <input type="text" id="upload-code" placeholder="Session code (e.g. WAINOT)" />
        <input type="file" id="upload-file" accept=".ndjson" style="color:#8b949e;font-size:11px;" />
        <input type="password" id="upload-token" placeholder="Bearer token" />
        <button class="upload-btn" id="upload-btn" onclick="uploadRecording()">Upload</button>
        <div class="upload-status" id="upload-status"></div>
      </div>
    </div>
    <div class="panel">
      <h2>Log <span id="log-count" class="badge">0</span></h2>
      <div class="log-panel" id="log"></div>
      <div class="status" id="log-status"></div>
    </div>
  </div>

  <script>
    const apiBase = window.location.href.replace(/\/+$/, '');

    async function refreshSessions() {
      try {
        const r = await fetch(`${apiBase}/sessions`);
        const sessions = await r.json();
        document.getElementById('session-count').textContent = sessions.length;
        const el = document.getElementById('sessions');
        if (sessions.length === 0) {
          el.innerHTML = '<div class="empty">No recorded sessions</div>';
        } else {
          el.innerHTML = sessions.map(s =>
            `<div class="session-item">
              <span class="session-code">${s}</span>
              <a class="dl-link" href="${apiBase}/sessions/${s}/recording" download="${s}.ndjson">↓ ndjson</a>
            </div>`
          ).join('');
        }
        document.getElementById('sessions-status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('sessions-status').textContent = `Error: ${e.message}`;
      }
    }

    let lastLogCount = 0;

    async function refreshLog() {
      try {
        const r = await fetch(`${apiBase}/log`);
        const lines = await r.json();
        document.getElementById('log-count').textContent = lines.length;
        if (lines.length !== lastLogCount) {
          lastLogCount = lines.length;
          const el = document.getElementById('log');
          // Reverse so newest is at top (panel is column-reverse)
          el.innerHTML = [...lines].reverse().map(line => {
            let cls = 'log-line';
            if (line.includes(' WARN ')) cls += ' warn';
            else if (line.includes(' ERROR')) cls += ' error';
            else if (line.includes(' CRIT ')) cls += ' crit';
            return `<div class="${cls}">${escHtml(line)}</div>`;
          }).join('');
        }
        document.getElementById('log-status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('log-status').textContent = `Error: ${e.message}`;
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('upload-token').value = localStorage.getItem('bearerToken') || '';
    document.getElementById('upload-file').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const code = file.name.replace(/\.ndjson$/i, '').toUpperCase();
        document.getElementById('upload-code').value = code;
      }
    });

    async function uploadRecording() {
      const code = document.getElementById('upload-code').value.trim().toUpperCase();
      const file = document.getElementById('upload-file').files[0];
      const token = document.getElementById('upload-token').value.trim();
      const status = document.getElementById('upload-status');
      const btn = document.getElementById('upload-btn');

      if (!code || !file || !token) {
        status.textContent = 'Fill in all fields.';
        status.className = 'upload-status err';
        return;
      }

      localStorage.setItem('bearerToken', token);
      btn.disabled = true;
      status.textContent = 'Uploading…';
      status.className = 'upload-status';

      try {
        const content = await file.text();
        const r = await fetch(`${apiBase}/sessions/${code}/recording`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-ndjson',
            'Authorization': `Bearer ${token}`,
          },
          body: content,
        });
        if (r.ok) {
          status.textContent = `Uploaded ${code} (${content.split('\n').filter(Boolean).length} entries)`;
          status.className = 'upload-status ok';
          refreshSessions();
        } else {
          status.textContent = `Failed: HTTP ${r.status}`;
          status.className = 'upload-status err';
        }
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        status.className = 'upload-status err';
      } finally {
        btn.disabled = false;
      }
    }

    refreshSessions();
    refreshLog();
    setInterval(refreshSessions, 10000);
    setInterval(refreshLog, 2000);
  </script>
</body>
</html>
