<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DotWatcher Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; font-size: 13px; padding: 16px; }
    h2 { color: #58a6ff; margin-bottom: 10px; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 32px); }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .sessions-list { overflow-y: auto; flex: 1; }
    .session-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .session-item:hover { background: #21262d; }
    .session-item.merge-source { background: #1c2128; border: 1px solid #58a6ff; }
    .session-item.merge-dimmed { opacity: 0.4; }
    .session-code { color: #f0883e; font-weight: bold; }
    .dl-link { color: #58a6ff; text-decoration: none; font-size: 11px; }
    .dl-link:hover { text-decoration: underline; }
    .log-panel { flex: 1; overflow-y: auto; }
    .log-line { padding: 2px 4px; border-radius: 2px; white-space: pre; line-height: 1.5; }
    .log-line:nth-child(odd) { background: #1c2128; }
    .log-line.warn { color: #e3b341; }
    .log-line.error { color: #f85149; }
    .log-line.crit { color: #f85149; font-weight: bold; }
    .status { color: #8b949e; font-size: 11px; margin-top: 8px; }
    .empty { color: #484f58; padding: 8px; }
    .badge { background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 10px; padding: 1px 7px; font-size: 10px; }
    .upload-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 6px; }
    .upload-section input[type=text], .upload-section input[type=password] { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; padding: 4px 8px; font-family: monospace; font-size: 12px; width: 100%; }
    .upload-section input[type=text]:focus, .upload-section input[type=password]:focus { outline: none; border-color: #58a6ff; }
    .upload-label { color: #8b949e; font-size: 11px; }
    .upload-btn { background: #238636; border: 1px solid #2ea043; border-radius: 4px; color: #fff; padding: 5px 10px; font-family: monospace; font-size: 12px; cursor: pointer; }
    .upload-btn:hover { background: #2ea043; }
    .upload-btn:disabled { opacity: 0.5; cursor: default; }
    .upload-status { font-size: 11px; min-height: 14px; }
    .upload-status.ok { color: #3fb950; }
    .upload-status.err { color: #f85149; }
    .del-btn { background: none; border: none; color: #6e7681; cursor: pointer; padding: 0 4px; display: flex; align-items: center; }
    .del-btn:hover { color: #f85149; }
    .merge-btn { background: none; border: none; color: #6e7681; cursor: pointer; padding: 0 4px; display: flex; align-items: center; }
    .merge-btn:hover { color: #58a6ff; }
    .filter-badge { color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 10px; margin-left: 6px; cursor: pointer; opacity: 0.85; }
    .filter-badge:hover { opacity: 1; }
    .merge-hint { font-size: 11px; color: #8b949e; background: #1c2128; border: 1px solid #30363d; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; display: none; }
    .merge-hint strong { color: #58a6ff; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="panel">
      <h2>Sessions <span id="session-count" class="badge">0</span></h2>
      <div class="merge-hint" id="merge-hint"></div>
      <div class="sessions-list" id="sessions"></div>
      <div class="status" id="sessions-status"></div>
      <div class="upload-section">
        <span class="upload-label">Upload recording</span>
        <input type="text" id="upload-code" placeholder="Session code (e.g. WAINOT)" />
        <input type="file" id="upload-file" accept=".ndjson" style="color:#8b949e;font-size:11px;" />
        <input type="password" id="upload-token" placeholder="Bearer token" />
        <button class="upload-btn" id="upload-btn" onclick="uploadRecording()">Upload</button>
        <div class="upload-status" id="upload-status"></div>
      </div>
    </div>
    <div class="panel">
      <h2><span id="log-header">Log</span> <span id="log-count" class="badge">0</span></h2>
      <div class="log-panel" id="log"></div>
      <div class="status" id="log-status"></div>
    </div>
  </div>

  <script>
    const apiBase = window.location.href.replace(/\/+$/, '');
    const clientBase = window.location.origin;

    const PALETTE = ['#ff5252','#ff9800','#ffeb3b','#00e676','#00e5ff','#448aff','#e040fb','#ff4081'];
    const sessionColors = {};
    let colorIndex = 0;

    function getSessionColor(code) {
      if (!sessionColors[code]) sessionColors[code] = PALETTE[colorIndex++ % PALETTE.length];
      return sessionColors[code];
    }

    function getLineSession(line) {
      for (const code of Object.keys(sessionColors)) {
        if (line.includes(`[${code}]`)) return code;
      }
      return null;
    }

    let activeSession = null;
    let cachedLines = [];
    let cachedSessions = [];
    let mergeSource = null;

    // --- Session rendering ---

    function renderSessions() {
      const el = document.getElementById('sessions');
      document.getElementById('session-count').textContent = cachedSessions.length;

      if (cachedSessions.length === 0) {
        el.innerHTML = '<div class="empty">No recorded sessions</div>';
        return;
      }

      el.innerHTML = cachedSessions.map(s => {
        const color = getSessionColor(s);
        const isSource = s === mergeSource;
        const isDimmed = mergeSource && !isSource;
        let cls = 'session-item';
        if (isSource) cls += ' merge-source';
        else if (isDimmed) cls += ' merge-dimmed';
        else if (activeSession === s) cls += ' active';

        return `<div class="${cls}" id="session-${s}" onclick="handleSessionClick('${s}')">
          <span class="session-code" style="color:${color}">${s}</span>
          <span style="display:flex;gap:8px;align-items:center;" onclick="event.stopPropagation()">
            <a class="dl-link" href="${clientBase}/${s}/replay" target="_blank" title="Open ${s} in viewer"><svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><ellipse cx="7" cy="7" rx="2.2" ry="5.5"/><line x1="1.5" y1="7" x2="12.5" y2="7"/></svg></a>
            <a class="dl-link" href="${apiBase}/sessions/${s}/recording" download="${s}.ndjson">↓ ndjson</a>
            ${!mergeSource ? `<button class="merge-btn" onclick="startMerge('${s}')" title="Merge ${s} into another session"><svg viewBox="0 0 20 14" width="14" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1,3 C7,3 9,7 13,7"/><path d="M1,11 C7,11 9,7 13,7"/><line x1="13" y1="7" x2="18" y2="7"/><polyline points="15,4 18.5,7 15,10"/></svg></button>` : ''}
            <button class="del-btn" onclick="deleteRecording('${s}')" title="Delete recording"><svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,3.5 13,3.5"/><path d="M5,3.5 L5,2 L9,2 L9,3.5"/><path d="M2.5,3.5 L3,12 L11,12 L11.5,3.5"/><line x1="5.5" y1="6" x2="5.5" y2="9.5"/><line x1="8.5" y1="6" x2="8.5" y2="9.5"/></svg></button>
          </span>
        </div>`;
      }).join('');

      const hint = document.getElementById('merge-hint');
      if (mergeSource) {
        hint.style.display = 'block';
        hint.innerHTML = `Select target to merge <strong>${escHtml(mergeSource)}</strong> into — or click it again to cancel.`;
      } else {
        hint.style.display = 'none';
      }
    }

    // --- Session click handling ---

    function handleSessionClick(code) {
      if (!mergeSource) {
        setSessionFilter(code);
        return;
      }
      if (code === mergeSource) {
        mergeSource = null;
        renderSessions();
        return;
      }
      if (confirm(`Merge "${mergeSource}" into "${code}"?\n\nAll records from ${mergeSource} will be moved to ${code}. This cannot be undone.`)) {
        doMerge(mergeSource, code);
      }
    }

    function startMerge(code) {
      mergeSource = code;
      renderSessions();
    }

    async function doMerge(src, tgt) {
      const token = document.getElementById('upload-token').value.trim();
      if (!token) { alert('Enter your bearer token in the field below first.'); return; }

      try {
        const r = await fetch(`${apiBase}/sessions/${tgt}/merge-from/${src}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
        });
        mergeSource = null;
        if (r.ok) {
          const result = await r.json();
          setUploadStatus(`Merged ${src} → ${tgt} (${result.recordsMerged} records)`, 'ok');
          await refreshSessions();
        } else {
          setUploadStatus(`Merge failed: HTTP ${r.status}`, 'err');
          renderSessions();
        }
      } catch (e) {
        mergeSource = null;
        setUploadStatus(`Merge error: ${e.message}`, 'err');
        renderSessions();
      }
    }

    // --- Log ---

    function setSessionFilter(code) {
      activeSession = (activeSession === code) ? null : code;
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      if (activeSession) {
        document.getElementById(`session-${activeSession}`)?.classList.add('active');
        showSessionRecords(activeSession);
      } else {
        renderLog(cachedLines);
      }
    }

    async function showSessionRecords(code) {
      const color = getSessionColor(code);
      const header = document.getElementById('log-header');
      header.innerHTML = `Records — <span style="color:${color}">${escHtml(code)}</span> <span class="filter-badge" style="background:${color}" onclick="setSessionFilter('${escHtml(code)}')" title="Clear">×</span>`;
      document.getElementById('log-count').textContent = '…';
      const el = document.getElementById('log');
      el.innerHTML = '<div class="empty">Loading…</div>';

      try {
        const r = await fetch(`${apiBase}/sessions/${code}/recording`);
        if (!r.ok) { el.innerHTML = '<div class="empty">No recording found.</div>'; return; }
        const text = await r.text();
        const rows = text.trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
        document.getElementById('log-count').textContent = rows.length;
        if (rows.length === 0) { el.innerHTML = '<div class="empty">No records.</div>'; return; }

        el.innerHTML = `
          <table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead>
              <tr style="color:#8b949e;text-align:left;border-bottom:1px solid #30363d;">
                <th style="padding:4px 6px;">#</th>
                <th style="padding:4px 6px;">Runner</th>
                <th style="padding:4px 6px;">Lat</th>
                <th style="padding:4px 6px;">Lon</th>
                <th style="padding:4px 6px;">Heading</th>
                <th style="padding:4px 6px;">Timestamp</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr style="border-bottom:1px solid #21262d;">
                  <td style="padding:3px 6px;color:#484f58;">${i + 1}</td>
                  <td style="padding:3px 6px;color:${getSessionColor(code)};font-weight:bold;">${escHtml(r.runnerName)}</td>
                  <td style="padding:3px 6px;">${r.latitude.toFixed(6)}</td>
                  <td style="padding:3px 6px;">${r.longitude.toFixed(6)}</td>
                  <td style="padding:3px 6px;color:#8b949e;">${r.heading != null ? r.heading.toFixed(1) + '°' : '—'}</td>
                  <td style="padding:3px 6px;color:#8b949e;">${escHtml(r.timestamp)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (e) {
        el.innerHTML = `<div class="empty">Error: ${escHtml(e.message)}</div>`;
      }
    }

    function renderLog(lines) {
      document.getElementById('log-header').textContent = 'Log';
      document.getElementById('log-count').textContent = lines.length;
      const el = document.getElementById('log');
      el.innerHTML = [...lines].reverse().map(line => {
        let cls = 'log-line';
        if (line.includes(' WARN ')) cls += ' warn';
        else if (line.includes(' ERROR')) cls += ' error';
        else if (line.includes(' CRIT ')) cls += ' crit';
        const sessionCode = getLineSession(line);
        const hasLevel = cls !== 'log-line';
        const colorStyle = (sessionCode && !hasLevel) ? `color:${getSessionColor(sessionCode)}` : '';
        return `<div class="${cls}" style="${colorStyle}">${escHtml(line)}</div>`;
      }).join('');
    }

    // --- Data fetching ---

    async function refreshSessions() {
      try {
        const r = await fetch(`${apiBase}/sessions`);
        cachedSessions = await r.json();
        cachedSessions.forEach(s => getSessionColor(s));
        renderSessions();
        document.getElementById('sessions-status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('sessions-status').textContent = `Error: ${e.message}`;
      }
    }

    async function refreshLog() {
      try {
        const r = await fetch(`${apiBase}/log`);
        cachedLines = await r.json();
        if (!activeSession) renderLog(cachedLines);
        document.getElementById('log-status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('log-status').textContent = `Error: ${e.message}`;
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setUploadStatus(msg, cls) {
      const el = document.getElementById('upload-status');
      el.textContent = msg;
      el.className = `upload-status ${cls}`;
    }

    // --- Upload / delete ---

    document.getElementById('upload-token').value = localStorage.getItem('bearerToken') || '';
    document.getElementById('upload-file').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const code = file.name.replace(/\.ndjson$/i, '').toUpperCase();
        document.getElementById('upload-code').value = code;
      }
    });

    async function uploadRecording() {
      const code = document.getElementById('upload-code').value.trim().toUpperCase();
      const file = document.getElementById('upload-file').files[0];
      const token = document.getElementById('upload-token').value.trim();
      const btn = document.getElementById('upload-btn');

      if (!code || !file || !token) {
        setUploadStatus('Fill in all fields.', 'err');
        return;
      }

      localStorage.setItem('bearerToken', token);
      btn.disabled = true;
      setUploadStatus('Uploading…', '');

      try {
        const content = await file.text();
        const r = await fetch(`${apiBase}/sessions/${code}/recording`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-ndjson',
            'Authorization': `Bearer ${token}`,
          },
          body: content,
        });
        if (r.ok) {
          setUploadStatus(`Uploaded ${code} (${content.split('\n').filter(Boolean).length} entries)`, 'ok');
          refreshSessions();
        } else {
          setUploadStatus(`Failed: HTTP ${r.status}`, 'err');
        }
      } catch (e) {
        setUploadStatus(`Error: ${e.message}`, 'err');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteRecording(code) {
      const token = document.getElementById('upload-token').value.trim();
      if (!token) { alert('Enter your bearer token first.'); return; }
      if (!confirm(`Delete recording for ${code}?`)) return;
      const r = await fetch(`${apiBase}/sessions/${code}/recording`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (r.ok || r.status === 204) {
        await refreshSessions();
      } else {
        alert(`Failed to delete: HTTP ${r.status}`);
      }
    }

    refreshSessions();
    refreshLog();
    setInterval(refreshSessions, 10000);
    setInterval(refreshLog, 2000);
  </script>
</body>
</html>
