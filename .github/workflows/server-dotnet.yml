name: Server .NET

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "server/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - ".github/workflows/server-dotnet.yml"

jobs:
  build-publish-test:
    name: Build, publish, and test
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's local dev credentials — tests connect via
    # tests/DotWatcher.Server.Tests/DotWatcherApiFactory.cs's BaseConnectionString.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dotwatcher
          POSTGRES_PASSWORD: dotwatcher-dev
          POSTGRES_DB: dotwatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore server/DotWatcher.Server.csproj

      - name: Build
        run: dotnet build server/DotWatcher.Server.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish server/DotWatcher.Server.csproj --configuration Release --no-build --output ./server/publish

      - name: Test
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f \( -name "*Tests.csproj" -o -name "*Test.csproj" \))

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET test projects found."
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            dotnet test "$project" --configuration Release --verbosity normal
          done
