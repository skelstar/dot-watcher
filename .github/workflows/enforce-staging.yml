name: Enforce PR Source Branch

on:
  pull_request:
    branches:
      - main # The branch being merged into

jobs:
  enforce-staging-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        run: |
          if [[ "${{ github.head_ref }}" != "staging" ]]; then
            echo "Error: Pull requests to main must originate from the 'staging' branch."
            echo "Current branch is: ${{ github.head_ref }}"
            exit 1
          fi
          echo "Source branch is valid."
