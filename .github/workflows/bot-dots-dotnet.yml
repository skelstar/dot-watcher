name: Bot-dots .NET

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "bot-dots/**"
      - ".github/workflows/bot-dots-dotnet.yml"

jobs:
  build-publish-test:
    name: Build, publish, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore bot-dots/BotDots.Service/BotDots.Service.csproj

      - name: Build
        run: dotnet build bot-dots/BotDots.Service/BotDots.Service.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish bot-dots/BotDots.Service/BotDots.Service.csproj --configuration Release --no-build --output ./bot-dots/publish

      - name: Test
        run: dotnet test bot-dots/BotDots.Service.Tests/BotDots.Service.Tests.csproj --configuration Release --verbosity normal
