info:
  name: 14 Delete palette
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{baseUrl}}/admin/palettes/{{paletteId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Now that nothing uses it, the delete goes through.
