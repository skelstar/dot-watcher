info:
  name: 9 Get palette (other version)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/me"
  headers:
    - name: X-App-Version
      value: 1.0.0 (1)
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.config.palette.name
      operator: neq
      value: Bruno test palette

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: A phone on a different version is unaffected.
