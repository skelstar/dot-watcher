info:
  name: 15 List palettes (bad token)
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/admin/palettes"
  auth:
    type: bearer
    token: not-the-token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: A wrong admin token gets a 401.
