info:
  name: 5 List palettes
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/palettes"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Every saved palette with the app versions each is assigned to.
