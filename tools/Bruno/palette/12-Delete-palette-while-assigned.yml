info:
  name: 12 Delete palette (while assigned)
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{baseUrl}}/admin/palettes/{{paletteId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Refused while the palette is assigned to a version.
